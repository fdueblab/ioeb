name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  release:
    types: [published]

jobs:
  test:
    name: Functional Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install and test
        run: |
          npm install -g yarn
          yarn install
          yarn test:functional
          yarn build

  build:
    name: Build & Push Frontend Image
    needs: test
    if: github.event_name != 'pull_request' && (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v'))
    runs-on: ubuntu-latest
    env:
      IMAGE_REPO: ${{ secrets.DOCKER_HUB_USERNAME }}/ioeb-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install and build
        run: |
          npm install -g yarn
          yarn install
          yarn build

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            IMAGE_TAG="${GITHUB_REF_NAME}"
            docker build -t "${IMAGE_REPO}:${IMAGE_TAG}" .
            docker push "${IMAGE_REPO}:${IMAGE_TAG}"
          else
            IMAGE_TAG=${GITHUB_SHA::7}
            docker build \
              -t "${IMAGE_REPO}:latest" \
              -t "${IMAGE_REPO}:${IMAGE_TAG}" .
            docker push "${IMAGE_REPO}:latest"
            docker push "${IMAGE_REPO}:${IMAGE_TAG}"
          fi

  deploy-staging:
    name: Deploy Staging
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      IMAGE_REPO: ${{ secrets.DOCKER_HUB_USERNAME }}/ioeb-frontend
    steps:
      - name: Trigger staging deploy webhook
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          curl -sf -X POST "${{ secrets.STAGING_DEPLOY_WEBHOOK_URL }}" \
            -H "X-Deploy-Token: ${{ secrets.STAGING_DEPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"service\":\"frontend\",\"image\":\"${IMAGE_REPO}:${IMAGE_TAG}\"}"

  deploy-production:
    name: Deploy Production
    needs: build
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    env:
      IMAGE_REPO: ${{ secrets.DOCKER_HUB_USERNAME }}/ioeb-frontend
    steps:
      - name: Trigger production deploy webhook
        run: |
          IMAGE_TAG="${GITHUB_REF_NAME}"
          curl -sf -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}" \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"service\":\"frontend\",\"image\":\"${IMAGE_REPO}:${IMAGE_TAG}\"}"
