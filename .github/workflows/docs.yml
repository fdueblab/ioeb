name: Build & Deploy Docs

on:
  push:
    branches: [master, docs]
    paths:
      - 'docs/**'
      - 'scripts/feishu-docs/**'
      - 'package.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE_REPO: ${{ secrets.DOCKER_HUB_USERNAME }}/ioeb-docs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - run: |
          SHORT_SHA=${GITHUB_SHA::7}
          docker build -f docs/Dockerfile \
            -t "${IMAGE_REPO}:latest" \
            -t "${IMAGE_REPO}:${SHORT_SHA}" .
          docker push "${IMAGE_REPO}:latest"
          docker push "${IMAGE_REPO}:${SHORT_SHA}"

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    env:
      IMAGE_REPO: ${{ secrets.DOCKER_HUB_USERNAME }}/ioeb-docs
    steps:
      - name: Trigger deploy webhook
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          curl -sf -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}" \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"service\":\"docs\",\"image\":\"${IMAGE_REPO}:${SHORT_SHA}\"}"

  sync-feishu-docs:
    name: Sync Feishu Docs
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_SPACE_ID: ${{ secrets.FEISHU_SPACE_ID }}
    steps:
      - name: Check Feishu secrets
        id: feishu
        run: |
          if [ -n "$FEISHU_APP_ID" ] && [ -n "$FEISHU_APP_SECRET" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Feishu secrets are not configured; skip knowledge base sync."
          fi

      - uses: actions/checkout@v4
        if: steps.feishu.outputs.enabled == 'true'

      - uses: actions/setup-node@v4
        if: steps.feishu.outputs.enabled == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package.json

      - name: Install docs tooling
        if: steps.feishu.outputs.enabled == 'true'
        run: npm --prefix docs install --ignore-scripts --package-lock=false

      - name: Sync docs to Feishu knowledge base
        if: steps.feishu.outputs.enabled == 'true'
        run: npm run docs:sync:feishu:strict

      - name: Commit updated Feishu sync map
        if: steps.feishu.outputs.enabled == 'true'
        run: |
          if git diff --quiet -- docs/feishu-sync.json; then
            echo "Feishu sync map unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/feishu-sync.json
          git commit -m "chore: update Feishu docs sync map [skip ci]"
          git push
